name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pdfplumber pandas openpyxl

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --windowed --name "Theo Calculator" theo_calculator.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Theo-Calculator-Windows
          path: dist/Theo Calculator.exe
