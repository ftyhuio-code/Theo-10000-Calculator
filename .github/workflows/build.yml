name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pdfplumber pandas openpyxl

      - name: Check files
        run: |
          dir
          python --version

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "Theo_10000_Calculator" "Theo_10000_Calculator.py"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Theo_10000_Calculator-Windows
          path: dist/Theo_10000_Calculator.exe
